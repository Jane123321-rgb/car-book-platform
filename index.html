<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>车书知识库管理平台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">车</div>
        <div class="logo-text">
          <div class="logo-title">车书知识库</div>
          <div class="logo-sub">管理平台</div>
        </div>
      </div>

      <nav class="menu">
        <div class="menu-item active" data-view="upload">
          <span class="menu-icon">⬆</span>
          <span class="menu-label">车书上传</span>
        </div>
        <div class="menu-item" data-view="generate">
          <span class="menu-icon">⚙</span>
          <span class="menu-label">生成知识库</span>
        </div>
        <div class="menu-item" data-view="review">
          <span class="menu-icon">✓</span>
          <span class="menu-label">知识库审核</span>
        </div>
        <div class="menu-item" data-view="list">
          <span class="menu-icon">≡</span>
          <span class="menu-label">知识库列表</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar">A</div>
          <div class="user-meta">
            <div class="user-name">Admin</div>
            <div class="user-role">超级管理员</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">
          <span>首页</span>
          <span class="sep">/</span>
          <span class="current" id="breadcrumb-current">车书上传</span>
        </div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>

      <section class="content" id="content">
        <!-- 视图通过 JS 动态渲染 -->
      </section>
    </main>
  </div>

  <!-- 模态框 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">标题</div>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
